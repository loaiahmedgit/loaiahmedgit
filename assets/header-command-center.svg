<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Loai Abouelezz — AI, data, and product engineer</title>
  <desc id="desc">Dark command-center inspired profile header with vivid orange accents and animated engineering nodes.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B10"/>
      <stop offset="0.58" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D00"/>
      <stop offset="0.52" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FFB067"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#27303B" stroke-width="1"/>
      <circle cx="1" cy="1" r="1" fill="#46515F"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panel-clip">
      <rect x="1" y="1" width="1198" height="258" rx="22"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="22" fill="url(#panel)" stroke="#303945" stroke-width="2"/>

  <g clip-path="url(#panel-clip)">
    <rect width="1200" height="260" fill="url(#microgrid)" opacity="0.23"/>
    <circle cx="1030" cy="120" r="250" fill="url(#flare)"/>
    <path d="M870 -35L1235 62V298L1038 245Z" fill="#FF6A00" opacity="0.035"/>
    <path d="M1030 -20L1235 34V182L1145 158Z" fill="#FF8A3D" opacity="0.055"/>
    <path d="M0 232H1200" stroke="#FF6A00" stroke-width="2" opacity="0.8"/>
    <rect x="-180" y="231" width="150" height="3" rx="1.5" fill="url(#orange)">
      <animate attributeName="x" values="-180;1200" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M32 75V32H75" fill="none" stroke="#FF6A00" stroke-width="3"/>
  <path d="M1125 32H1168V75" fill="none" stroke="#FF6A00" stroke-width="3"/>
  <path d="M32 185V228H75" fill="none" stroke="#596574" stroke-width="2"/>
  <path d="M1125 228H1168V185" fill="none" stroke="#596574" stroke-width="2"/>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <circle cx="83" cy="51" r="5" fill="#FF6A00" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="99" y="56" fill="#8995A3" font-size="13" font-weight="700" letter-spacing="2.3">LOAI.ABOUELEZZ / PROFILE_01</text>

    <text x="78" y="125" fill="#F4F7FB" font-family="'Segoe UI', Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="-1">Loai</text>
    <text x="213" y="125" fill="url(#orange)" font-family="'Segoe UI', Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="-1">Abouelezz</text>

    <rect x="80" y="144" width="40" height="4" rx="2" fill="#FF6A00"/>
    <text x="132" y="151" fill="#BEC7D2" font-size="16" font-weight="600" letter-spacing="0.7">AI + DATA / PRODUCT ENGINEERING / RELIABLE SYSTEMS</text>

    <g transform="translate(80 183)">
      <rect width="142" height="28" rx="6" fill="#161D26" stroke="#384351"/>
      <circle cx="16" cy="14" r="4" fill="#FF6A00"/>
      <text x="29" y="18" fill="#D8DEE7" font-size="11" font-weight="700" letter-spacing="1.1">DOHA, QATAR</text>

      <g transform="translate(154)">
        <rect width="190" height="28" rx="6" fill="#161D26" stroke="#384351"/>
        <circle cx="16" cy="14" r="4" fill="#FF8A3D"/>
        <text x="29" y="18" fill="#D8DEE7" font-size="11" font-weight="700" letter-spacing="1.1">QATAR UNIVERSITY</text>
      </g>

      <g transform="translate(356)">
        <rect width="159" height="28" rx="6" fill="#161D26" stroke="#384351"/>
        <circle cx="16" cy="14" r="4" fill="#FFB067"/>
        <text x="29" y="18" fill="#D8DEE7" font-size="11" font-weight="700" letter-spacing="1.1">CLASS OF 2027</text>
      </g>
    </g>
  </g>

  <g transform="translate(790 39)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="0" y="12" fill="#788594" font-size="11" font-weight="700" letter-spacing="2">BUILD MATRIX</text>
    <text x="307" y="12" fill="#FF8A3D" font-size="11" text-anchor="end">ONLINE</text>

    <path d="M44 91L140 50L249 93L141 151Z" fill="none" stroke="#485462" stroke-width="1.5"/>
    <path d="M44 91L141 151M140 50L141 151M249 93L140 50" fill="none" stroke="#303A46" stroke-width="1"/>

    <g>
      <circle cx="44" cy="91" r="29" fill="#111821" stroke="#FF6A00" stroke-width="2"/>
      <circle cx="44" cy="91" r="34" fill="none" stroke="#FF6A00" opacity="0.25">
        <animate attributeName="r" values="30;39;30" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0;0.45" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="95" fill="#F3F6FA" font-size="13" font-weight="800" text-anchor="middle">AI</text>
    </g>

    <g>
      <circle cx="140" cy="50" r="29" fill="#111821" stroke="#FF8A3D" stroke-width="2"/>
      <circle cx="140" cy="50" r="34" fill="none" stroke="#FF8A3D" opacity="0.25">
        <animate attributeName="r" values="30;39;30" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0;0.45" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
      </circle>
      <text x="140" y="54" fill="#F3F6FA" font-size="12" font-weight="800" text-anchor="middle">DATA</text>
    </g>

    <g>
      <circle cx="249" cy="93" r="29" fill="#111821" stroke="#FFB067" stroke-width="2"/>
      <circle cx="249" cy="93" r="34" fill="none" stroke="#FFB067" opacity="0.25">
        <animate attributeName="r" values="30;39;30" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0;0.45" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="249" y="97" fill="#F3F6FA" font-size="11" font-weight="800" text-anchor="middle">PRODUCT</text>
    </g>

    <g>
      <circle cx="141" cy="151" r="29" fill="#111821" stroke="#768292" stroke-width="2"/>
      <circle cx="141" cy="151" r="5" fill="#FF6A00" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="141" y="187" fill="#8995A3" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">BUILD / TEST / SHIP</text>
    </g>
  </g>
</svg>
