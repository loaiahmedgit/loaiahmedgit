<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="124" viewBox="0 0 1200 124" role="img" aria-labelledby="title desc">
  <title id="title">Loai Abouelezz profile footer</title>
  <desc id="desc">Compact dark status footer with orange signal accents.</desc>

  <defs>
    <linearGradient id="footer-panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#090C11"/>
      <stop offset="0.5" stop-color="#10161E"/>
      <stop offset="1" stop-color="#090C11"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FFB067" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#44505D"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="122" rx="18" fill="url(#footer-panel)" stroke="#303945" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="120" rx="17" fill="url(#dots)" opacity="0.13"/>

  <path d="M31 38V24H45M1155 24H1169V38M31 86V100H45M1155 100H1169V86" fill="none" stroke="#FF6A00" stroke-width="2"/>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <circle cx="73" cy="61" r="5" fill="#FF6A00" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="58" fill="#F0F3F7" font-size="11" font-weight="800" letter-spacing="1.4">STATUS</text>
    <text x="88" y="75" fill="#8995A3" font-size="10" font-weight="700" letter-spacing="1.2">OPEN TO BUILD</text>

    <text x="600" y="57" fill="#E6EBF2" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">“Build systems that are useful, measurable, and worthy of trust.”</text>
    <text x="600" y="80" fill="#FF8A3D" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2.4">END OF PROFILE // SIGNAL ACTIVE</text>

    <text x="1122" y="58" fill="#F0F3F7" font-size="11" font-weight="800" text-anchor="end" letter-spacing="1.4">DOHA · QA</text>
    <text x="1122" y="75" fill="#8995A3" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1.2">LOAI.ABOUELEZZ</text>
  </g>

  <rect x="255" y="101" width="690" height="2" rx="1" fill="url(#signal)" opacity="0.82"/>
  <circle cx="255" cy="102" r="3" fill="#FF8A3D" filter="url(#glow)">
    <animate attributeName="cx" values="255;945;255" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
