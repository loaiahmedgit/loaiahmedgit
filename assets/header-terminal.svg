<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Loai Abouelezz terminal profile header</title>
  <desc id="desc">Black terminal screen with orange block lettering, engineering interests, active projects, and a hello world command.</desc>

  <defs>
    <linearGradient id="terminal-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="1" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="orange-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.38" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#E65300"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#FFFFFF" stroke-width="0.5" opacity="0.035"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect x="1" y="1" width="1198" height="408" rx="10"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="408" rx="10" fill="url(#terminal-bg)" stroke="#2A2A2A" stroke-width="2"/>

  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="1200" height="410" fill="url(#scanlines)"/>
    <rect x="0" y="-90" width="1200" height="90" fill="#FF6A00" opacity="0.022">
      <animate attributeName="y" values="-90;410" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'Courier New', monospace">
    <text x="28" y="26" fill="#FF6A00" font-size="14" letter-spacing="1">============================================================================================================</text>
    <text x="28" y="57" fill="#D8D8D8" font-size="15">Welcome to the Loai Development Environment @ GitHub</text>

    <g font-family="'Courier New', 'Liberation Mono', monospace" font-weight="900" font-size="76" letter-spacing="-3">
      <text x="37" y="146" fill="none" stroke="#7A2700" stroke-width="3" opacity="0.95">LOAI ABOUELEZZ</text>
      <text x="33" y="141" fill="none" stroke="#B93D00" stroke-width="3" opacity="0.95">LOAI ABOUELEZZ</text>
      <text x="28" y="136" fill="url(#orange-fill)" stroke="#FF8A3D" stroke-width="0.7" filter="url(#soft-glow)">LOAI ABOUELEZZ</text>
    </g>

    <text x="28" y="168" fill="#FF6A00" font-size="14" letter-spacing="1">============================================================================================================</text>

    <text x="28" y="198" fill="#FF8A3D" font-size="15" font-weight="700">whoami</text>
    <text x="205" y="198" fill="#D8D8D8" font-size="15">Computer Science student @ Qatar University</text>

    <text x="28" y="226" fill="#FF8A3D" font-size="15" font-weight="700">interest --list</text>
    <text x="205" y="226" fill="#F2B180" font-size="15">AI  |  data engineering  |  product systems  |  machine learning</text>

    <text x="28" y="254" fill="#FF8A3D" font-size="15" font-weight="700">projects --active</text>
    <text x="205" y="254" fill="#D8D8D8" font-size="15">NASQ  |  Maseera</text>

    <text x="28" y="282" fill="#FF8A3D" font-size="15" font-weight="700">stack --core</text>
    <text x="205" y="282" fill="#D8D8D8" font-size="15">Python  |  SQL  |  TypeScript  |  Flutter</text>

    <text x="28" y="310" fill="#FF8A3D" font-size="15" font-weight="700">status --career</text>
    <text x="205" y="310" fill="#F2B180" font-size="15">open to AI, data, and software engineering internships</text>

    <text x="28" y="340" fill="#FF6A00" font-size="14" letter-spacing="1">============================================================================================================</text>

    <text x="28" y="370" fill="#FF6A00" font-size="15" font-weight="700">loai@github</text>
    <text x="131" y="370" fill="#BDBDBD" font-size="15">:</text>
    <text x="141" y="370" fill="#FF8A3D" font-size="15" font-weight="700">~$</text>
    <text x="172" y="370" fill="#D8D8D8" font-size="15">echo "hello, world"</text>

    <text x="28" y="394" fill="#F2B180" font-size="14">hello, world</text>
    <rect x="125" y="381" width="9" height="16" fill="#FF6A00">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
