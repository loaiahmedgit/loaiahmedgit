<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Loai Abouelezz</title>
  <desc id="desc">Computer Science, AI and Data, and Product Engineering profile header with a subtle animated Pac-Man chasing a cherry.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E65300"/>
      <stop offset="0.5" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>

    <mask id="pacman-mask">
      <circle cx="0" cy="0" r="23" fill="#fff"/>
      <path d="M0 0 L30 -18 L30 18 Z" fill="#000">
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1 1;1 0.12;1 1"
          dur="0.48s"
          repeatCount="indefinite"/>
      </path>
    </mask>

    <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7A2500" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#background)"/>

  <g opacity="0.22">
    <circle cx="105" cy="46" r="3" fill="#fff"/>
    <circle cx="215" cy="74" r="2" fill="#fff"/>
    <circle cx="331" cy="43" r="3" fill="#fff"/>
    <circle cx="874" cy="58" r="2" fill="#fff"/>
    <circle cx="1015" cy="39" r="3" fill="#fff"/>
    <circle cx="1112" cy="78" r="2" fill="#fff"/>
  </g>

  <g opacity="0.28" transform="translate(40 62)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="40 62;1080 62"
      dur="16s"
      repeatCount="indefinite"/>

    <g>
      <circle cx="0" cy="0" r="23" fill="#FFE45C" mask="url(#pacman-mask)"/>
      <circle cx="3" cy="-10" r="2.4" fill="#8A3100"/>
    </g>

    <g transform="translate(88 0)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="88 -3;88 3;88 -3"
        dur="1.4s"
        repeatCount="indefinite"/>
      <path d="M0 -8 C7 -22 15 -24 23 -28" fill="none" stroke="#2F7D32" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 -26 C27 -31 34 -27 36 -20 C27 -18 21 -20 18 -26 Z" fill="#55B94A"/>
      <circle cx="-7" cy="3" r="10" fill="#D7263D"/>
      <circle cx="9" cy="3" r="10" fill="#F03A47"/>
      <circle cx="-10" cy="0" r="2.5" fill="#FF9AA4" opacity="0.8"/>
      <circle cx="6" cy="0" r="2.5" fill="#FFB1B8" opacity="0.8"/>
    </g>
  </g>

  <g fill="#fff" text-anchor="middle" filter="url(#soft-shadow)">
    <text x="600" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">Loai Abouelezz</text>
    <text x="600" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.7">Computer Science  |  AI and Data  |  Product Engineering</text>
  </g>

  <path d="M0 222 C220 197 392 246 615 222 C825 199 1002 210 1200 232 L1200 260 L0 260 Z" fill="#C94700" opacity="0.42"/>
  <path d="M0 239 C236 218 408 259 635 239 C836 222 1021 229 1200 245 L1200 260 L0 260 Z" fill="#FFB066" opacity="0.34"/>
</svg>
