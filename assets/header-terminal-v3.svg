    <text x="28" y="360" fill="#FF6A00" font-size="14" letter-spacing="1">============================================================================================================</text>

    <text x="28" y="389" fill="#FF6A00" font-size="15" font-weight="700">loai@github</text>
    <text x="131" y="389" fill="#BDBDBD" font-size="15">:</text>
    <text x="141" y="389" fill="#FF8A3D" font-size="15" font-weight="700">~$</text>
    <text x="172" y="389" fill="#D8D8D8" font-size="15">echo "hello, world"</text>

    <text x="28" y="414" fill="#F2B180" font-size="14">hello, world</text>
    <rect x="125" y="401" width="9" height="16" fill="#FF6A00">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
