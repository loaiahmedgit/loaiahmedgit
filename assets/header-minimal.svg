<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Loai Abouelezz</title>
  <desc id="desc">Minimal dark engineering profile header with restrained orange accents.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E65300"/>
      <stop offset="0.5" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#30363D" stroke-width="1"/>
    </pattern>

    <filter id="orange-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="198" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="196" rx="17" fill="url(#grid)" opacity="0.22"/>

  <path d="M38 52 V28 H62" fill="none" stroke="#FF6A00" stroke-width="3" stroke-linecap="round"/>
  <path d="M1138 28 H1162 V52" fill="none" stroke="#FF6A00" stroke-width="3" stroke-linecap="round"/>
  <path d="M38 148 V172 H62" fill="none" stroke="#FF6A00" stroke-width="3" stroke-linecap="round"/>
  <path d="M1138 172 H1162 V148" fill="none" stroke="#FF6A00" stroke-width="3" stroke-linecap="round"/>

  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="47" fill="#FF8A3D" font-size="13" font-weight="700" letter-spacing="4">COMPUTER SCIENCE · QATAR UNIVERSITY</text>
    <text x="600" y="105" fill="#F0F6FC" font-size="50" font-weight="750" letter-spacing="0.4">Loai Abouelezz</text>
    <text x="600" y="139" fill="#AAB4C0" font-size="18" font-weight="500" letter-spacing="0.7">AI and Data  ·  Product Engineering  ·  Reliable Systems</text>
  </g>

  <rect x="82" y="170" width="1036" height="2" rx="1" fill="url(#accent)" opacity="0.72"/>
  <circle cx="82" cy="171" r="4" fill="#FF8A3D" filter="url(#orange-glow)">
    <animate attributeName="cx" values="82;1118;82" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
