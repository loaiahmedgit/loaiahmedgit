<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="82" viewBox="0 0 1200 82" role="img" aria-labelledby="title desc">
  <title id="title">Pac-Man cherry chase</title>
  <desc id="desc">A fast animated Pac-Man eats a cherry and another cherry immediately appears farther ahead.</desc>

  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E65300"/>
      <stop offset="0.5" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>

    <mask id="pacman-mask">
      <circle cx="0" cy="0" r="20" fill="#fff"/>
      <path d="M0 0 L27 -16 L27 16 Z" fill="#000">
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1 1;1 0.08;1 1"
          dur="0.22s"
          repeatCount="indefinite"/>
      </path>
    </mask>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="80" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M42 41 H1158" stroke="url(#track)" stroke-width="2" stroke-dasharray="4 17" stroke-linecap="round" opacity="0.55"/>

  <g opacity="1" transform="translate(40 41)" filter="url(#glow)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="40 41;320 28;590 53;860 30;1110 43"
      keyTimes="0;0.24;0.49;0.74;1"
      dur="3.6s"
      repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="20" fill="#FFE45C" mask="url(#pacman-mask)"/>
    <circle cx="3" cy="-9" r="2.2" fill="#6B2B00"/>
  </g>

  <g transform="translate(320 28)">
    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.23;0.24;1"
      dur="3.6s"
      repeatCount="indefinite"/>
    <g transform="scale(0.78)">
      <path d="M0 -7 C6 -19 13 -21 20 -25" fill="none" stroke="#45A049" stroke-width="4" stroke-linecap="round"/>
      <path d="M16 -23 C24 -28 31 -24 33 -18 C25 -16 19 -18 16 -23 Z" fill="#58C45C"/>
      <circle cx="-6" cy="3" r="9" fill="#D7263D"/>
      <circle cx="8" cy="3" r="9" fill="#F03A47"/>
      <circle cx="-9" cy="0" r="2.2" fill="#FFB1B8"/>
      <circle cx="5" cy="0" r="2.2" fill="#FFC0C6"/>
    </g>
  </g>

  <g transform="translate(590 53)" opacity="0">
    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.23;0.24;0.48;0.49;1"
      dur="3.6s"
      repeatCount="indefinite"/>
    <g transform="scale(0.78)">
      <path d="M0 -7 C6 -19 13 -21 20 -25" fill="none" stroke="#45A049" stroke-width="4" stroke-linecap="round"/>
      <path d="M16 -23 C24 -28 31 -24 33 -18 C25 -16 19 -18 16 -23 Z" fill="#58C45C"/>
      <circle cx="-6" cy="3" r="9" fill="#D7263D"/>
      <circle cx="8" cy="3" r="9" fill="#F03A47"/>
      <circle cx="-9" cy="0" r="2.2" fill="#FFB1B8"/>
      <circle cx="5" cy="0" r="2.2" fill="#FFC0C6"/>
    </g>
  </g>

  <g transform="translate(860 30)" opacity="0">
    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.48;0.49;0.73;0.74;1"
      dur="3.6s"
      repeatCount="indefinite"/>
    <g transform="scale(0.78)">
      <path d="M0 -7 C6 -19 13 -21 20 -25" fill="none" stroke="#45A049" stroke-width="4" stroke-linecap="round"/>
      <path d="M16 -23 C24 -28 31 -24 33 -18 C25 -16 19 -18 16 -23 Z" fill="#58C45C"/>
      <circle cx="-6" cy="3" r="9" fill="#D7263D"/>
      <circle cx="8" cy="3" r="9" fill="#F03A47"/>
      <circle cx="-9" cy="0" r="2.2" fill="#FFB1B8"/>
      <circle cx="5" cy="0" r="2.2" fill="#FFC0C6"/>
    </g>
  </g>

  <g transform="translate(1110 43)" opacity="0">
    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.73;0.74;1"
      dur="3.6s"
      repeatCount="indefinite"/>
    <g transform="scale(0.78)">
      <path d="M0 -7 C6 -19 13 -21 20 -25" fill="none" stroke="#45A049" stroke-width="4" stroke-linecap="round"/>
      <path d="M16 -23 C24 -28 31 -24 33 -18 C25 -16 19 -18 16 -23 Z" fill="#58C45C"/>
      <circle cx="-6" cy="3" r="9" fill="#D7263D"/>
      <circle cx="8" cy="3" r="9" fill="#F03A47"/>
      <circle cx="-9" cy="0" r="2.2" fill="#FFB1B8"/>
      <circle cx="5" cy="0" r="2.2" fill="#FFC0C6"/>
    </g>
  </g>
</svg>
